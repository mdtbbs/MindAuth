<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>授权失败 - MindAuth</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/standalone.css">
  <script src="/standalone.js"></script>
    <script>
      // 与用户中心共用 localStorage 键 `theme`（同 MDTBBS 论坛），避免深色用户白屏闪烁
      (function () {
        try {
          var theme = localStorage.getItem('theme');
          if (theme === 'dark' || theme === 'light') {
            document.documentElement.setAttribute('data-theme', theme);
          }
        } catch (e) {}
      })();
    </script>
</head>
<body>
  <div class="bg-pattern"></div>
  <button class="theme-toggle" id="theme-toggle" title="切换主题">
    <span id="theme-icon" aria-hidden="true">☾</span>
  </button>

  <main class="error-page-shell">
    <section class="error-page-panel">
      <div class="error-page-code" id="error-code">OAUTH_ERROR</div>
      <h1 class="error-page-title" id="error-title">授权失败</h1>
      <p class="error-page-desc" id="error-desc">无法完成本次授权请求。</p>
      <div class="error-page-actions">
        <button class="btn-primary" onclick="goBack()">返回上一页</button>
        <a class="btn-secondary" href="/" style="text-decoration:none;">账号中心</a>
      </div>
    </section>
  </main>

  <script>
    const errorMessages = {
      invalid_client: ['应用不存在', 'OAuth 应用配置不存在或已被删除。'],
      invalid_redirect: ['回调地址不匹配', 'OAuth 回调地址与应用配置不一致。'],
      invalid_request: ['请求参数有误', '授权请求缺少必要参数。'],
      unsupported_response_type: ['不支持的响应类型', '当前授权请求的 response_type 不受支持。'],
      invalid_scope: ['授权范围无效', '请求的授权范围不在允许列表内。'],
      server_error: ['服务器错误', '授权服务暂时无法完成请求。']
    };

    function goBack() {
      if (document.referrer) {
        window.history.back();
      } else {
        window.location.href = '/';
      }
    }

    const params = new URLSearchParams(window.location.search);
    const error = params.get('error') || 'oauth_error';
    const description = params.get('description');
    const mapped = errorMessages[error] || ['授权失败', '无法完成本次授权请求。'];

    document.getElementById('error-code').textContent = error.toUpperCase();
    document.getElementById('error-title').textContent = mapped[0];
    document.getElementById('error-desc').textContent = description || mapped[1];
  </script>
</body>
</html>
