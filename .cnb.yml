.base-ci: &base-ci
  name: ci
  services:
    - docker
  docker:
    image: node:20
    volumes:
      - node_modules
  env:
    NODE_ENV: test
    PORT: '4001'
    BASE_URL: http://localhost:4001
    ADMIN_SECRET: ci-admin-secret-that-is-long-enough-32
    MYSQL_HOST: 127.0.0.1
    MYSQL_PORT: '3306'
    MYSQL_USER: root
    MYSQL_PASSWORD: root
    MYSQL_DATABASE: mindauth_test
    REDIS_HOST: 127.0.0.1
    REDIS_PORT: '6379'
    REDIS_PASSWORD: ''
    REDIS_DB: '15'
    RUN_INTEGRATION: '1'
  stages:
    - name: install
      script: npm ci

    - name: start-services
      script: |
        docker run -d --name mindauth-mysql \
          -e MYSQL_ROOT_PASSWORD=root \
          -e MYSQL_DATABASE=mindauth_test \
          -p 3306:3306 \
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent" \
          --health-interval=5s --health-timeout=5s --health-retries=30 \
          mysql:8
        docker run -d --name mindauth-redis \
          -p 6379:6379 \
          --health-cmd="redis-cli ping" \
          --health-interval=5s --health-timeout=5s --health-retries=30 \
          redis:7

    - name: wait-db-ready
      script: |
        for i in $(seq 1 60); do
          mh=$(docker inspect -f '{{.State.Health.Status}}' mindauth-mysql 2>/dev/null || echo down)
          rh=$(docker inspect -f '{{.State.Health.Status}}' mindauth-redis 2>/dev/null || echo down)
          echo "[$i] mysql=$mh redis=$rh"
          if [ "$mh" = "healthy" ] && [ "$rh" = "healthy" ]; then exit 0; fi
          sleep 2
        done
        echo "DB services not ready in time"
        exit 1

    - name: lint
      script: npm run lint

    - name: typecheck
      script: npm run typecheck

    - name: build
      script: npm run build

    - name: unit
      script: npm run test:unit

    - name: prepare-db
      script: npm run test:db:prepare

    - name: integration
      script: npm run test:integration

    - name: e2e
      env:
        USE_MEMORY_REDIS: '1'
      script: |
        npx playwright install --with-deps chromium
        npm run test:e2e
      timeout: 30m

main:
  push:
    - *base-ci

"**":
  pull_request:
    - *base-ci
