.base-ci: &base-ci
  name: ci
  services:
    - docker
  docker:
    image: node:20
    volumes:
      - node_modules
  env:
    # Force the runner to UTC so MySQL's DATETIME (mysql:8 defaults to UTC) is
    # parsed and compared consistently. Without this, nativeAuth integration
    # tests that read `expires_at` back and compare to `new Date()` see a
    # fresh transaction as already expired (runner local tz ahead of DB UTC).
    TZ: UTC
    NODE_ENV: test
    PORT: '4001'
    BASE_URL: http://localhost:4001
    ADMIN_SECRET: ci-admin-secret-that-is-long-enough-32
    MYSQL_HOST: 127.0.0.1
    MYSQL_PORT: '3306'
    MYSQL_USER: root
    MYSQL_PASSWORD: root
    MYSQL_DATABASE: mindauth_test
    REDIS_HOST: 127.0.0.1
    REDIS_PORT: '6379'
    REDIS_PASSWORD: ''
    REDIS_DB: '15'
    RUN_INTEGRATION: '1'
  stages:
    - name: install
      script: npm ci

    - name: start-services
      script: |
        docker run -d --name mindauth-mysql \
          -e MYSQL_ROOT_PASSWORD=root \
          -e MYSQL_DATABASE=mindauth_test \
          -e TZ=UTC \
          -p 3306:3306 \
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent" \
          --health-interval=5s --health-timeout=5s --health-retries=30 \
          mysql:8
        docker run -d --name mindauth-redis \
          -p 6379:6379 \
          --health-cmd="redis-cli ping" \
          --health-interval=5s --health-timeout=5s --health-retries=30 \
          redis:7

    - name: wait-db-ready
      script: |
        for i in $(seq 1 60); do
          mh=$(docker inspect -f '{{.State.Health.Status}}' mindauth-mysql 2>/dev/null || echo down)
          rh=$(docker inspect -f '{{.State.Health.Status}}' mindauth-redis 2>/dev/null || echo down)
          echo "[$i] mysql=$mh redis=$rh"
          if [ "$mh" = "healthy" ] && [ "$rh" = "healthy" ]; then exit 0; fi
          sleep 2
        done
        echo "DB services not ready in time"
        exit 1

    - name: lint
      script: npm run lint

    - name: typecheck
      script: npm run typecheck

    - name: build
      script: npm run build

    - name: unit
      # 单元测试运行在开发语义下：它们 mock DB，且会校验“无密码本地开发账号”
      # 等开发态配置，因此不能带全局的 NODE_ENV=test。
      env:
        NODE_ENV: development
      script: npm run test:unit

    - name: prepare-db
      script: npm run test:db:prepare

    - name: integration
      script: npm run test:integration

    - name: e2e
      env:
        USE_MEMORY_REDIS: '1'
      # The Playwright config runs two browser projects (chromium + mobile)
      # against a shared MySQL DB + shared in-process webServer.  Running the
      # full stateful OAuth/session suite twice against the same mutable DB
      # pollutes state for the second project (e.g. the seeded `forum` OAuth
      # client is left mutated), which makes OAuth/session E2E tests fail only
      # in the second project.  Run each project as its own playwright
      # invocation, and reset the test DB (and thus the per-run in-process
      # Redis) in between, so both projects start from identical clean state.
      script: |
        npx playwright install --with-deps chromium
        npm run test:db:prepare
        npx playwright test --project=chromium
        # Wipe & re-seed the test DB so the mobile project starts clean.
        docker exec mindauth-mysql mysql -uroot -proot -e "DROP DATABASE IF EXISTS mindauth_test"
        npm run test:db:prepare
        npx playwright test --project=mobile
      timeout: 30m

main:
  push:
    - *base-ci

"**":
  pull_request:
    - *base-ci
