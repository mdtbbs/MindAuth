<h2>UI 设计风格对比</h2>
<p class="subtitle">三种现代 UI 风格的视觉效果展示</p>

<div class="split">
  <div class="mockup">
    <div class="mockup-header">极简科技风 (Linear/Vercel)</div>
    <div class="mockup-body" style="background: #0a0a0a; padding: 24px; color: white;">
      <div style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 16px;">
        <div style="font-size: 14px; font-weight: 500; margin-bottom: 12px; color: #fff;">账户设置</div>
        <div style="display: flex; gap: 8px; margin-bottom: 16px;">
          <button style="border: 1px solid rgba(255,255,255,0.2); background: transparent; color: #fff; padding: 8px 16px; border-radius: 6px; font-size: 13px;">保存</button>
          <button style="border: 1px solid rgba(255,255,255,0.1); background: transparent; color: rgba(255,255,255,0.6); padding: 8px 16px; border-radius: 6px; font-size: 13px;">取消</button>
        </div>
        <input type="text" placeholder="输入内容" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 10px 12px; border-radius: 6px; width: 100%; font-size: 14px;">
      </div>
      <div style="margin-top: 12px; font-size: 11px; color: rgba(255,255,255,0.4);">
        ✓ 深色背景、精细边框、微妙 hover
      </div>
    </div>
  </div>

  <div class="mockup">
    <div class="mockup-header">工具型 UI (GitHub/Notion)</div>
    <div class="mockup-body" style="background: #f6f8fa; padding: 24px;">
      <div style="background: #fff; border: 1px solid #d0d7de; border-radius: 6px; padding: 16px;">
        <div style="font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #24292f;">账户设置</div>
        <div style="display: flex; gap: 8px; margin-bottom: 16px;">
          <button style="border: 1px solid #d0d7de; background: #f6f8fa; color: #24292f; padding: 5px 16px; border-radius: 6px; font-size: 14px;">保存</button>
          <button style="border: 1px solid #d0d7de; background: #fff; color: #57606a; padding: 5px 16px; border-radius: 6px; font-size: 14px;">取消</button>
        </div>
        <input type="text" placeholder="输入内容" style="background: #fff; border: 1px solid #d0d7de; color: #24292f; padding: 5px 12px; border-radius: 6px; width: 100%; font-size: 14px;">
      </div>
      <div style="margin-top: 12px; font-size: 11px; color: #57606a;">
        ✓ 高信息密度、一致组件设计
      </div>
    </div>
  </div>
</div>

<div class="mockup" style="margin-top: 24px;">
  <div class="mockup-header">现代卡片风格</div>
  <div class="mockup-body" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 24px; color: white;">
    <div style="background: rgba(255,255,255,0.95); border-radius: 24px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
      <div style="font-size: 18px; font-weight: 600; margin-bottom: 16px; color: #333;">账户设置</div>
      <div style="display: flex; gap: 12px; margin-bottom: 20px;">
        <button style="background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; padding: 12px 24px; border-radius: 12px; font-size: 14px; border: none;">保存</button>
        <button style="background: #f5f5f5; color: #666; padding: 12px 24px; border-radius: 12px; font-size: 14px; border: none;">取消</button>
      </div>
    </div>
    <div style="margin-top: 12px; font-size: 11px; color: rgba(255,255,255,0.7);">
      ✓ 大圆角、渐变、丰富动画
    </div>
  </div>
</div>

<h3 style="margin-top: 24px;">请选择动画效果</h3>
<div class="options">
  <div class="option" data-choice="subtle" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>微妙动画</h3>
      <p>hover 边框加深、点击轻微缩放，几乎无感知但有流畅感</p>
    </div>
  </div>
  <div class="option" data-choice="rich" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>丰富入场动画</h3>
      <p>页面加载时元素滑入、放大、渐变，视觉冲击强</p>
    </div>
  </div>
  <div class="option" data-choice="mixed" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>混合方案</h3>
      <p>首次进入有入场动画，后续操作使用微妙动画</p>
    </div>
  </div>
</div>
