name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mindauth_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      PORT: 4001
      BASE_URL: http://localhost:4001
      ADMIN_SECRET: ci-admin-secret-that-is-long-enough-32
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: mindauth_test
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      RUN_INTEGRATION: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Unit tests
        run: npm run test:unit
        # Unit configuration tests intentionally exercise development defaults.
        # Integration and E2E retain the job-level NODE_ENV=test setting.
        env:
          NODE_ENV: development

      - name: Integration tests
        shell: bash
        run: |
          set +e
          npm run test:integration 2>&1 | tee "$RUNNER_TEMP/integration-tests.log"
          result=${PIPESTATUS[0]}
          if [[ "$result" -ne 0 ]]; then
            excerpt="$(grep -n -B 6 -A 18 -E 'not ok|failureType|error:|AssertionError|Error:|ERR_' "$RUNNER_TEMP/integration-tests.log" | tail -n 100)"
            if [[ -z "$excerpt" ]]; then
              excerpt="$(tail -n 50 "$RUNNER_TEMP/integration-tests.log")"
            fi
            excerpt="${excerpt//'%'/'%25'}"
            excerpt="${excerpt//$'\r'/'%0D'}"
            excerpt="${excerpt//$'\n'/'%0A'}"
            printf '::notice file=.github/workflows/ci.yml,line=1::%s\n' "$excerpt"
            {
              echo "### Integration test failure output"
              tail -n 120 "$RUNNER_TEMP/integration-tests.log"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
        env:
          USE_MEMORY_REDIS: '1'
